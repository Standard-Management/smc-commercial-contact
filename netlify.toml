# SMC Commercial Contact: Netlify build settings.
# The build installs the font packages (package.json) and copies the font files into assets/fonts/.
# Publish the repository root. Assets revalidate on each load (no-cache), so a fresh deploy shows at once.
[build]
  command = "npm install --no-audit --no-fund && npm run fonts"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache"
